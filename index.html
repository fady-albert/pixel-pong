<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL PONG</title>
    <!-- import css file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="mainCon">
        <!-- start page -->
        <div class="startPage" id="startPage">
            <h1>pixel pong</h1>
            <button id="startBtn">start</button>
        </div>
        <!-- game page -->
        <div class="gamePage" id="gamePage">

            <!-- show the score -->
            <div class="score">
                <div class="player1">
                    <span id="score1">0</span>
                </div>
                <div class="player2">
                    <span id="score2">0</span>
                </div>
            </div>

            <!-- game board -->
            <div class="gameBoard">
                <canvas id="gameCanvas" width="800" height="450"></canvas>
            </div>

            <!-- controls -->
            <div class="controls">
                <div class="con">
                    <p>player 1: W/S</p>
                    <p>player 2: ↑/↓</p>
                </div>
            </div>
            
        </div>
    </div>
    
    <!-- import javascript file -->
    <script src="script.js"></script>
</body>
</html>
